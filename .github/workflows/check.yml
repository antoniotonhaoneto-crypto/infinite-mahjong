name: Static checks and unit tests
on:
  push:
  pull_request:
jobs:
  javascript-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ES Modules syntax
        shell: bash
        run: |
          for f in js/*.js sw.js; do
            node --check "$f"
          done
      - name: Run automated unit tests
        shell: bash
        run: node --test tests/game.test.mjs
